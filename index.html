<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Captcha</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: max-content;
            box-sizing: border-box;
        }
        .question {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            user-select: none;
        }
        input {
            width: 40px;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
        }
        button {
            padding: 4px 8px;
            background: #0076ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        button:hover { background: #0055d0; }
        .success { color: green; font-size: 14px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="captcha-box" style="display: flex; align-items: center; gap: 8px;">
        <span class="question" id="quest"></span>
        <input type="text" id="ans" placeholder="?">
        <button onclick="checkCaptcha()">Проверить</button>
    </div>
    <span class="success" id="ok-msg">✓ Пройдено</span>

    <script>
        const num1 = Math.floor(Math.random() * 10) + 1;
        const num2 = Math.floor(Math.random() * 10) + 1;
        const correctAnswer = num1 + num2;

        document.getElementById('quest').innerText = `${num1} + ${num2} =`;

        function checkCaptcha() {
            const userAnswer = parseInt(document.getElementById('ans').value);
            
            if (userAnswer === correctAnswer) {
                document.getElementById('captcha-box').style.display = 'none';
                document.getElementById('ok-msg').style.display = 'inline';

                window.parent.postMessage({ event: 'captcha_passed' }, '*');
            } else {
                alert('Неверно, попробуйте еще раз!');
                document.getElementById('ans').value = '';
            }
        }
    </script>
</body>
</html>
